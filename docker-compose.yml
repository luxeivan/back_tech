services:
  back_tech:
    build: .
    container_name: back_tech
    restart: unless-stopped
    ports:
      - "3110:3110"
    env_file:
      - .env
    environment:
      NODE_EXTRA_CA_CERTS: /app/certs/ca-bundle.pem
    volumes:
      - ./data:/app/data
      - ./import_data:/app/import_data
      - ./scripts:/app/scripts
      - ./diagnostic-scripts:/app/diagnostic-scripts
